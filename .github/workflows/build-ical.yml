name: Build and Publish iCal

on:
  schedule:
    - cron: "0 * * * *"   # every hour; adjust as needed
  workflow_dispatch:       # allow manual runs
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/build-ical.yml"

# Avoid overlapping runs racing on the commit step
concurrency:
  group: build-ical
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-ical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate calendar.ics
        env:
          ENGAGE_API_URL: ${{ secrets.ENGAGE_API_URL }}
          ENGAGE_API_KEY: ${{ secrets.ENGAGE_API_KEY }}
          UID_DOMAIN: "fairmontstate.edu"
          WINDOW_DAYS: "30"
          OUTPUT_PATH: "docs/calendar.ics"
          TIMEZONE_HINT: "America/New_York"
        run: |
          python scripts/generate_ical.py

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update calendar.ics"
          file_pattern: docs/calendar.ics

      # Resets GitHub's 60-day inactivity auto-disable timer for scheduled
      # workflows, so the hourly cron survives long stretches with no commits
      # (e.g. summer break)
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/build-ical.yml/enable
